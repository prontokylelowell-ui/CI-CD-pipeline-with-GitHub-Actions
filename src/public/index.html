<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD Demo - GitHub Actions</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 60px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      text-align: center;
    }
    h1 { font-size: 2.5rem; color: #333; margin-bottom: 16px; }
    .badge {
      display: inline-block;
      background: #22c55e;
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .pipeline {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 32px 0;
      flex-wrap: wrap;
    }
    .step {
      background: #f3f4f6;
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .check { color: #22c55e; font-weight: bold; }
    p { color: #666; line-height: 1.6; margin-bottom: 12px; }
    .meta {
      background: #f9fafb;
      border-radius: 12px;
      padding: 20px;
      margin-top: 32px;
      text-align: left;
      font-size: 0.875rem;
    }
    .meta div { margin-bottom: 8px; }
    .meta span { color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">✅ Deployed Successfully</div>
    <h1>CI/CD Pipeline Demo</h1>
    <p>Every push triggers automated build, test, and deployment.</p>
    <div class="pipeline">
      <div class="step"><span class="check">✓</span>Build</div>
      <div class="step"><span class="check">✓</span>Test</div>
      <div class="step"><span class="check">✓</span>Push</div>
      <div class="step"><span class="check">✓</span>Deploy</div>
    </div>
    <p style="font-size: 0.875rem; color: #888;">
      Powered by GitHub Actions + Docker
    </p>
    <div class="meta">
      <div><span>Version:</span> <strong id="version">Loading...</strong></div>
      <div><span>Environment:</span> <strong id="env">Loading...</strong></div>
      <div><span>Status:</span> <strong id="status" style="color:#22c55e">Checking...</strong></div>
    </div>
  </div>
  <script>
    fetch('/api/info')
      .then(r => r.json())
      .then(data => {
        document.getElementById('env').textContent = data.environment;
        document.getElementById('version').textContent = data.commit.substring(0, 7);
      });
    fetch('/api/health')
      .then(r => r.json())
      .then(data => {
        document.getElementById('status').textContent = data.status;
      });
  </script>
</body>
</html>
